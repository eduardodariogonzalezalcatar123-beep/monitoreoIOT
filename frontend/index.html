<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<title>Dashboard Sensores</title>
</head>

<body>

<header>
<h1>Sistema de Monitoreo de Sensores</h1>
</header>

<div class="container">

    <div id="alerta-global" style="display: none; width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 1.2rem;">
       ⚠️ AVISO: <span id="mensaje-alerta"></span>
    </div>

<!-- SENSOR 1 -->
<div class="card">

<h2>
SENSOR 1 
<span class="status normal" id="estado1">● NORMAL</span>
</h2>

<div class="value" id="valor1">-- °C</div>

<canvas id="grafica1"></canvas>

<p id="fecha1">Última lectura: --</p>

<div class="buttons">

<a href="pages/historial.html">
<button class="btn">Ver Historial</button>
</a>

<a href="pages/configuracion.html?id=1">
<button class="btn primary">Configurar</button>
</a>

</div>
</div>


<!-- SENSOR 2 -->
<div class="card">

<h2>
SENSOR 2 
<span class="status warning" id="estado2">● ADVERTENCIA</span>
</h2>

<div class="value" id="valor2">-- °C</div>

<canvas id="grafica2"></canvas>

<p id="fecha2">Última lectura: --</p>

<div class="buttons">

<a href="pages/historial.html">
<button class="btn">Ver Historial</button>
</a>

<a href="pages/configuracion.html?id=2">
<button class="btn primary">Configurar</button>
</a>

</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById("grafica1");

const grafica1 = new Chart(ctx, {
type: "line",
data: {
labels: ["10:00","10:05","10:10","10:15","10:20"],
datasets: [{
label: "Sensor 1",
data: [70,72,74,75,73],
borderColor: "#16A34A",
fill: false
}]
},
options: {
responsive: true
}
});

const ctx2 = document.getElementById("grafica2");

const grafica2 = new Chart(ctx2, {
type: "line",
data: {
labels: ["10:00","10:05","10:10","10:15","10:20"],
datasets: [{
label: "Sensor 2",
data: [85,88,90,92,91],
borderColor: "#F97316",
fill: false
}]
}
});

async function cargarDashboard() {
    try {
        const res = await fetch("http://localhost:8080/api/dashboard.php");
        const data = await res.json();
        console.log("Datos recibidos:", data);

        const banner = document.getElementById("alerta-global");
        const mensaje = document.getElementById("mensaje-alerta");
        
        let alertaActiva = false;
        let textoAlerta = "";
        let colorAlerta = "";

        data.forEach((sensor, index) => {
            const idNum = index + 1;
            
            // Forzamos la conversión a número y limpiamos posibles espacios
            const lectura = Number(sensor.ultima_lectura);
            const min = Number(sensor.limite_min);
            const max = Number(sensor.limite_max);

            console.log(`Sensor ${idNum}: Valor=${lectura}, Max=${max}, ¿Supera?: ${lectura > max}`);

            // Actualizar interfaz
            if(document.getElementById(`valor${idNum}`)) {
                document.getElementById(`valor${idNum}`).innerText = lectura + " °C";
                document.getElementById(`estado${idNum}`).innerText = "● " + (sensor.estado_actual || "").toUpperCase();
                document.getElementById(`fecha${idNum}`).innerText = "Última lectura: " + (sensor.ultima_fecha || "--");
            }

            // Lógica de Alerta
            if (lectura > max) {
                alertaActiva = true;
                textoAlerta += `⚠️ ${sensor.nombre}: CRÍTICO (${lectura}°C > ${max}°C) `;
                colorAlerta = "#EF4444"; 
            } else if (lectura < min) {
                alertaActiva = true;
                textoAlerta += `❄️ ${sensor.nombre}: BAJO (${lectura}°C < ${min}°C) `;
                if (!colorAlerta) colorAlerta = "#3B82F6";
            }
        });

        // SALIMOS DEL BUCLE Y DECIDIMOS
        if (alertaActiva) {
            mensaje.innerText = textoAlerta;
            banner.style.backgroundColor = colorAlerta;
            banner.style.color = "white";
            banner.style.display = "block";
        } else {
            banner.style.display = "none";
        }

    } catch (error) {
        console.error("Error al conectar con la base de datos:", error);
    }
}

cargarDashboard();

/* actualizar cada 5 segundos */
setInterval(cargarDashboard,5000);

</script>

</body>
</html>
